name: ci

# The firm's first CI. Deliberately narrow: bash syntax across bin/, the tests/ suite on both bash 3.2
# (macOS's permanent default — this repo's own scripts hold themselves to it) and a modern bash, and
# firm-run-evals --structural (structure only — no `claude` login, no spend). Model-driven eval
# execution (`firm-run-evals` without --structural, `firm-gpt-qa`, live `firm-doctor --probe`) stays
# manual: those need a real login and real budget, which CI does not have.
#
# The suite is NOT dependency-free: the scripts under test and several tests themselves shell out to
# python3, `test-validate-verdict` needs `jsonschema`, and `test-policy-yaml-valid` needs `pyyaml`.
# Both are installed, at pinned versions, in the step below.

"on":
  push:
  pull_request:

# Least privilege for GITHUB_TOKEN. Declared explicitly because an absent `permissions:` key silently
# inherits the REPOSITORY default, which may be read/write. Nothing here writes to the repo, posts a
# comment, or publishes anything — checkout and setup-python only read. A workflow-level block also
# sets every unlisted scope to `none`, so a later step cannot quietly acquire more; if a job ever does
# need to write, give that one job its own narrower `permissions:` rather than widening this.
permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to a full commit SHA, not a tag: `@v4` is a MUTABLE ref the action's owner
      # can repoint at any commit, so a tag pin is a standing supply-chain hole. The trailing comment
      # carries the human-readable version so this stays reviewable; re-resolve it when bumping.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: bash -n across every bin/firm-*
        run: |
          set -e
          for f in bin/firm-*; do
            echo "checking $f"
            bash -n "$f"
          done

  # Two OSes on purpose: ubuntu-latest carries a modern bash, macos-latest is invoked via /bin/bash
  # specifically to exercise the 3.2.x the scripts claim to support (macOS ships an ancient bash for
  # licensing reasons and always will — Homebrew's newer bash on the PATH would defeat the point).
  test:
    needs: syntax
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: git identity for scratch-repo fixtures
        run: |
          git config --global user.email ci@agent-firm.local
          git config --global user.name "agent-firm CI"
          git config --global init.defaultBranch main
      # Versions are pinned so a CI result is reproducible and a bad upstream release can't turn a
      # green run red (or vice versa) without a reviewed commit here. Both have cp312 wheels for the
      # ubuntu-x86_64 and macos-arm64 runners, so no build toolchain is needed.
      - name: install the declared prerequisites (pinned)
        run: python -m pip install jsonschema==4.26.0 pyyaml==6.0.3
      - name: run the suite (default bash)
        run: bash tests/run-tests.sh
      - name: run the suite (bash 3.2 compatibility — /bin/bash specifically)
        run: /bin/bash tests/run-tests.sh
      - name: firm-run-evals --structural (structure only — no claude login, no spend)
        run: bin/firm-run-evals --structural
