name: ci

# Hosted runners are outside the exact P2 ledger-write row. They run every suite that is meaningful
# on an unsupported host, including a real-host assertion that writes fail closed before mutation.
# The complete write-path suite is a manual dispatch to a deliberately labelled exact-P2 self-hosted
# runner; pull-request code can never schedule that trusted runner. Structural eval mode remains
# provider-neutral and offline — no login and no spend.
#
# The suite is NOT dependency-free: the scripts and tests shell out to python3 and Node;
# `test-validate-verdict` needs `jsonschema`, and `test-policy-yaml-valid` needs `pyyaml`. Hosted
# runners provide Node; the exact-P2 runner is explicitly checked. Python packages are pinned below.

"on":
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_exact_p2:
        description: Run the full suite on a trusted exact-P2 self-hosted runner
        required: true
        default: false
        type: boolean

# Least privilege for GITHUB_TOKEN. Declared explicitly because an absent `permissions:` key silently
# inherits the REPOSITORY default, which may be read/write. Nothing here writes to the repo, posts a
# comment, or publishes anything — checkout and setup-python only read. A workflow-level block also
# sets every unlisted scope to `none`, so a later step cannot quietly acquire more; if a job ever does
# need to write, give that one job its own narrower `permissions:` rather than widening this.
permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to a full commit SHA, not a tag: `@v4` is a MUTABLE ref the action's owner
      # can repoint at any commit, so a tag pin is a standing supply-chain hole. The trailing comment
      # carries the human-readable version so this stays reviewable; re-resolve it when bumping.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: bash -n across every bin/firm-*
        run: |
          set -e
          for f in bin/firm-*; do
            echo "checking $f"
            bash -n "$f"
          done
      - name: provider manifest base versions agree
        run: bin/firm-version --check

  # Two hosted OSes on purpose: Ubuntu supplies modern Bash/GNU userland and macOS supplies Bash 3.2/
  # BSD userland. Neither claims successful ledger mutation: their OS/Python rows are unsupported.
  test:
    needs: syntax
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: git identity for scratch-repo fixtures
        run: |
          git config --global user.email ci@agent-firm.local
          git config --global user.name "agent-firm CI"
          git config --global init.defaultBranch main
      # Versions are pinned so a CI result is reproducible and a bad upstream release can't turn a
      # green run red (or vice versa) without a reviewed commit here. Both have cp312 wheels for the
      # ubuntu-x86_64 and macos-arm64 runners, so no build toolchain is needed.
      - name: install the declared prerequisites (pinned)
        run: python -m pip install jsonschema==4.26.0 pyyaml==6.0.3
      - name: run unsupported-P2 suite (modern Bash and GNU userland)
        if: runner.os == 'Linux'
        run: bash tests/run-tests.sh --unsupported-p2
      - name: run unsupported-P2 suite (macOS Bash 3.2 and BSD userland)
        if: runner.os == 'macOS'
        run: /bin/bash tests/run-tests.sh --unsupported-p2
      - name: firm-run-evals --structural (provider-neutral; no login, no spend)
        run: bin/firm-run-evals --structural

  # Manual-only by construction: untrusted pull-request code must never reach a self-hosted runner.
  # Provision the runner with the default labels plus the custom `agent-firm-p2` label. The explicit
  # probe below prevents a stale/mislabelled machine from silently weakening what this job proves.
  exact-p2:
    name: exact P2 full write-path suite
    if: github.event_name == 'workflow_dispatch' && inputs.run_exact_p2
    needs: syntax
    runs-on: [self-hosted, macOS, ARM64, agent-firm-p2]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: create an isolated environment from the runner's P2 Python
        run: |
          p2_venv="$RUNNER_TEMP/agent-firm-p2-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          python3 -m venv "$p2_venv"
          "$p2_venv/bin/python" -m pip install jsonschema==4.26.0 pyyaml==6.0.3
          printf '%s\n' "$p2_venv/bin" >> "$GITHUB_PATH"
      - name: verify the exact P2 process row
        run: |
          command -v node >/dev/null
          python3 - <<'PY'
          import platform, sys
          actual = (
              platform.system(), platform.mac_ver()[0], platform.release(),
              platform.machine(), tuple(sys.version_info[:3]), sys.implementation.name,
          )
          expected = ("Darwin", "26.5.1", "25.5.0", "arm64", (3, 9, 6), "cpython")
          if actual != expected:
              raise SystemExit(f"exact P2 runner mismatch: expected {expected!r}, got {actual!r}")
          PY
      - name: git identity for scratch-repo fixtures
        run: |
          git config --global user.email ci@agent-firm.local
          git config --global user.name "agent-firm CI"
          git config --global init.defaultBranch main
      - name: run the full suite (default bash)
        run: bash tests/run-tests.sh
      - name: run the full suite (macOS Bash 3.2)
        run: /bin/bash tests/run-tests.sh
      - name: firm-run-evals --structural (provider-neutral; no login, no spend)
        run: bin/firm-run-evals --structural
