name: gpt-judge-availability
description: The legacy-named availability eval verifies that whichever cross-provider judge is secondary returns exit 3 for an incompatible model; the primary provider records the skipped voice and stops at the final gate rather than treating absence as approval.
fixture: ./fixture
kickoff: ./task.md
assertions:
  - file_exists: src/ping.js
  - file_exists: test/ping.test.js
  - test_passes: node --test
  - test_passes: sh -c 'if [ "${FIRM_EVAL_PROVIDER:-claude}" = codex ]; then FIRM_CLAUDE_QA_FORCE_INCOMPAT=1 firm-claude-qa "$PWD" >/dev/null 2>&1; else FIRM_GPT_QA_FORCE_INCOMPAT=1 firm-gpt-qa "$PWD" >/dev/null 2>&1; fi; [ "$?" -eq 3 ]'
  - artifact_exists: 08-qa-verdict.json
  - verdict_is: APPROVE
  - final_gate_pending: true
  - no_default_branch_merge: true
