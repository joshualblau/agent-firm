# Definition of Done — a deliverable is only "done" when ALL applicable items hold.
# "applicable" is judged against the task track (fast-path waives the N/A items explicitly).

definition_of_done:
  - acceptance criteria satisfied, or explicitly waived with a recorded reason
  - implementation summary written (06-implementation-summary.md)
  - tests added for new behavior, or the omission is justified in writing
  - unit tests pass
  - integration / e2e tests pass where applicable
  - visual checks pass or are marked not_applicable with a reason
  - >-
    QA verdict is APPROVE and validates against qa-verdict.schema.json — `firm-validate-verdict` must
    exit 0. Exit 4 (DEGRADED — `jsonschema` absent, so the verdict was never schema-checked) does NOT
    satisfy this item — install the prerequisite and re-validate. An unverifiable verdict is not evidence.
  - QA checkout left no visible changes — the LEAD runs `firm-qa-clean-check` against the same checkout
    QA used, immediately after QA returns (never QA checking itself). This proves absence of visible
    changes, not read-only enforcement — see docs/ENFORCEMENT.md. A non-zero exit is a BLOCK.
  - >-
    Cross-provider QA is mechanically satisfied — `firm-final-qa-check <run_dir>` exits 0 after
    validating the persisted clean candidate generation and full SHA, schema-valid primary verdict,
    strict one-row-per-criterion traceability with current hashed evidence, secondary verdict or
    recorded availability attempt plus any required human waiver, derived high-risk state, and every
    secondary-blocker disposition. Exit 1 is blocking; exit 2 means the gate could not be evaluated
    and is also blocking; exit 3 is an unavailable required second voice and is not approval. Exit 4
    is decision_required: it authorizes only a non-ship-ready draft plus one exact Final interaction,
    not completion. After one matching typed human record is appended, one fresh mechanical rerun must
    exit 0; rejection, mismatch, staleness, or any other nonzero result remains blocking.
  - >-
    Reviewer execution is auditable and bounded — each provider wrapper used the controlled judge
    contract and disposable control root, recorded discovery/readiness/judge phases in a numbered
    attempt, published no verdict until exact candidate identity validated, wrote explicit-target
    run-ledger events, retained only capped redacted diagnostics by default, and left no uncontrolled
    provider state as gate evidence.
  - no unexplained snapshot/baseline changes
  - secret scan run with no findings (or findings triaged + justified)
  - changelog / docs updated if the change is user-facing
  - rollback / migration notes included if relevant
  - run.jsonl and the run-ledger are complete
  - >-
    10-handoff.md was first assembled as a non-ship-ready draft, the Final human interaction occurred
    once with exact objections/options, any resulting human record is typed and digest-bound to the
    current run/full SHA, and the handoff was finalized only after a fresh firm-final-qa-check exit 0
  # Applies only when the project has a relational DB with role separation:
  - least-privilege DB grants — for any change adding DB tables/roles, the request-path role holds NO
    write on catalog/config/append-only/PII/identity tables; every engagement-scoped table has FORCE
    RLS + repository-only (repo-only) access; the implementer attaches a GRANT audit the reviewer verifies
  # Applies to any change adding/altering tests:
  - >-
    no-overclaim tests — a test's asserted property is ACTUALLY exercised (a multi-axis / "both X and Y"
    test must vary EVERY axis it names; a title/describe may not claim a guarantee its body does not
    drive); the reviewer checks test bodies against their titles
