# Definition of Done — a deliverable is only "done" when ALL applicable items hold.
# "applicable" is judged against the task track (fast-path waives the N/A items explicitly).

definition_of_done:
  - acceptance criteria satisfied, or explicitly waived with a recorded reason
  - implementation summary written (06-implementation-summary.md)
  - tests added for new behavior, or the omission is justified in writing
  - unit tests pass
  - integration / e2e tests pass where applicable
  - visual checks pass or are marked not_applicable with a reason
  - QA verdict is APPROVE and validates against qa-verdict.schema.json — `firm-validate-verdict` must
    exit 0. Exit 4 (DEGRADED — `jsonschema` absent, so the verdict was never schema-checked) does NOT
    satisfy this item: install the prerequisite and re-validate. An unverifiable verdict is not evidence.
  - no unexplained snapshot/baseline changes
  - secret scan run with no findings (or findings triaged + justified)
  - changelog / docs updated if the change is user-facing
  - rollback / migration notes included if relevant
  - run.jsonl and the run-ledger are complete
  - final human approval recorded in 10-handoff.md
  # Applies only when the project has a relational DB with role separation:
  - least-privilege DB grants — for any change adding DB tables/roles, the request-path role holds NO
    write on catalog/config/append-only/PII/identity tables; every engagement-scoped table has FORCE
    RLS + repository-only (repo-only) access; the implementer attaches a GRANT audit the reviewer verifies
  # Applies to any change adding/altering tests:
  - no-overclaim tests — a test's asserted property is ACTUALLY exercised: a multi-axis / "both X and Y"
    test must vary EVERY axis it names; a title/describe may not claim a guarantee its body does not
    drive; the reviewer checks test bodies against their titles
