# Model tiers are provider-neutral. Runtime adapters map each tier to a concrete provider model.

principle: >-
  Effort matters as much as tier. Reserve the ceiling for exceptional work and never silently
  downgrade a role after a rate-limit or compatibility failure.

tiers:
  ceiling:
    role: "The ceiling — slowest and quota-heaviest."
    used_for: "Escalate TO it only for the hardest/novel design work, or a genuinely hard specialist."
    never: "Not the Lead. Keep the security_privacy review lens OFF Fable — its safety classifiers can refuse security-adjacent work."
    claude: {model: fable, display: "Fable 5", effort: max}
    codex: {model: gpt-5.6-sol, display: "GPT-5.6 sol", effort: ultra}

  heavyweight:
    role: "Default heavyweight."
    roles: [lead, intake-analyst, architect, implementer, integrator, reviewer]
    claude: {model: opus, display: "Opus 5", effort: xhigh}
    codex: {model: gpt-5.6-sol, display: "GPT-5.6 sol", effort: xhigh}

  workhorse:
    role: "Workhorse."
    roles: [recruiter, packager, qa-tester, "hired specialists, unless the job spec justifies more"]
    claude: {model: sonnet, display: "Sonnet 5", effort: high}
    codex: {model: gpt-5.6-terra, display: "GPT-5.6 terra", effort: high}

  fast:
    role: "Cheap/fast."
    roles: [scout]
    used_for: "Broad read-only sweeps, simple classification, mechanical work — keeps expensive models focused on the diff."
    claude: {model: haiku, display: "Haiku 4.5", effort: low}
    codex: {model: gpt-5.6-terra, display: "GPT-5.6 terra", effort: low}

legacy_aliases:
  fable: ceiling
  opus: heavyweight
  sonnet: workhorse
  haiku: fast
  codex: heavyweight

quota_discipline: >-
  Wide heavyweight implementer fan-out is the most likely way to hit a plan rate-limit. Respect
  max_specialists_concurrent, prefer fewer/larger work-orders, and use the fast scout for reconnaissance.
