# Bounded execution — quality is prioritized over cost, but every run is capped.
# A breach is a STOP condition AND a process defect surfaced in the retrospective.
# The Lead sets the track at intake; caps below are defaults the Lead may tighten (never silently loosen).

defaults:
  fast_path:
    max_specialists_concurrent: 1
    max_subagents_total: 4
    max_turns_per_agent: 25
    max_wall_clock_minutes: 20
    max_files_changed: 15
    max_test_repair_loops: 2        # implementer stops + reports after this many repair attempts
    max_review_panel_size: 1

  full_track:
    max_specialists_concurrent: 3
    max_subagents_total: 12
    max_turns_per_agent: 60
    max_wall_clock_minutes: 120
    max_files_changed: 80
    max_test_repair_loops: 3
    max_review_panel_size: 4

  # Greenfield / multi-module product builds. SAME per-run caps as full_track, but delivered as
  # MULTIPLE bounded runs — one coherent slice each, with a human Final gate per run. The caps below
  # are PER-RUN, not per-engagement: a greenfield product is inherently >80 files, so the Architect
  # decomposes it into dependency-ordered slices at design time (see agents/architect.md run-phasing
  # plan) and the Lead opens a FRESH run per phase. Exceeding one run's caps is therefore a PLANNED
  # multi-run engagement, not a breach — provided the phasing was decided at the Architecture gate.
  greenfield_build:
    max_specialists_concurrent: 3
    max_subagents_total: 12
    max_turns_per_agent: 60
    max_wall_clock_minutes: 120
    max_files_changed: 80          # per-run; total across phases is expected to exceed this
    max_test_repair_loops: 3
    max_review_panel_size: 4

stop_conditions:
  - any cap above is reached -> stop the offending agent, log budget_or_usage_limit, escalate to Lead
  - the same test fails after max_test_repair_loops -> stop, report failure, do NOT weaken the test
  - a plan/usage rate-limit is hit (Claude or Codex) -> pause, surface to human, suggest API-key fallback
  - net new files changed exceed max_files_changed -> stop and re-scope with the human

# Note: "cost is not the constraint" (max subscriptions) but unbounded loops, rate-limit throttling,
# and human review-load ARE. Caps protect those, not the bill.

# WHAT max_subagents_total COUNTS, AND WHY IT MATTERS THAT IT IS SPAWNS.
#
# It counts agents STARTED, not messages sent. RESUMING an agent that already ran -- handing its
# own defect back to the author who wrote it -- does not consume a slot.
#
# This is not a loophole to route around the cap; it is what the cap was already measuring. The cap
# exists to bound review load, context fragmentation, and rate-limit exposure, and a resumption adds
# none of them: no new role, no new context to brief, no fourth opinion for a human to reconcile. It
# is also the BETTER outcome on correctness. The author holds the context, remembers what they
# rejected and why, and can be told "you closed this on trust; verify it" -- which is how the
# strongest findings in run 20260902T064517Z-link-audit-tool were produced, including a reviewer
# re-attacking its own fix and finding a second defect in it.
#
# MEASURED, and the reason this is written down. On that run the Recruiter spent the roster to
# exactly 12 of 12 and flagged the zero slack as risk R-1 before Build started. The risk then
# materialised in full: the review panel returned changes_requested, and closing it took three fix
# cycles, two re-integrations, a re-issued QA verdict and a second judge run. Every one was absorbed
# by resumption. Had each needed a fresh agent the run would have hit a hard stop mid-flight and
# escalated to the human -- not because the work was unbounded, but because the budget would have
# been counting the wrong thing.
#
# So a roster AT the cap is viable, and the Recruiter may plan one deliberately -- but only with the
# fix path named. See agent-firm/contracts/roles/recruiter.md.
#
# WHAT THIS DOES NOT LICENSE. Resumption is not free: it spends turns, tokens and wall clock, and
# max_turns_per_agent still binds each resumed agent. An agent resumed indefinitely is an unbounded
# loop wearing a different hat, and the stop conditions above apply to it unchanged. If a fix cycle
# needs a role nobody on the roster holds, that is a NEW agent and a real budget decision -- resuming
# an ill-suited agent to dodge the count is worse than asking.
