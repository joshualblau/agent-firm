    git_emails:
      - joshualblau@gmail.com
    note: >-
      Repository owner (github.com/joshualblau/agent-firm). Observed in history as
      "josh <joshualblau@gmail.com>".

  - gh_login: younglionsolutions
    git_emails:
      - younglionsolutions@youngs-mbp.lan
    note: >-
