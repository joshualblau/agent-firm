# Traceability matrix — every acceptance criterion mapped to code, tests, and evidence.
# Produced during Review/QA; bin/traceability-check enforces it against 08-qa-verdict.json.
task_slug:
matrix:
  - id: AC-001
    implementation_files: []     # e.g. [src/greet.js]
    tests: []                    # e.g. [test/greet.test.js::adds two numbers]
    manual_verification: ""     # if verification was manual, describe it
    evidence: ""                # path under 09-test-evidence/ or a note
    status: uncovered            # covered | partial | uncovered
# Rule: an `uncovered` criterion fails the traceability gate UNLESS it carries an explicit
# justification (e.g. waived at the Requirements gate, or out of scope).

# Cross-provider review state. `firm-final-qa-check` validates this section. The helper validates
# recorded state; it cannot determine whether a claimed dissent or risk classification is truthful.
two_voice:
  secondary_provider: ""       # gpt | claude
  status: available            # available | unavailable
  required: false              # true for auth / permissions / crypto / PII
  human_waiver:
    granted: false
    record: ""                 # required when an unavailable second voice was required
two_voice_diff: []              # one entry for every blocker in the secondary verdict
# Example entry:
# - secondary_blocker: "exact blocker text from the secondary verdict"
#   primary_position: "positive dissent with the evidence read differently"
#   positive_dissent: true
#   risk: low                   # low | high; ambiguity is high
#   bounded_resolution:
#     attempted: true
#     rerun: block              # approve | block | not_run | not_required
#     evidence: "09-test-evidence/two-voice-resolution.md"
#   evidence: "Primary evidence and rationale"
#   disposition: proceed_with_primary  # unresolved | fixed | secondary_withdrew | human_decision | proceed_with_primary
