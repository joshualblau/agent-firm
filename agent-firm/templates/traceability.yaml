# Candidate-bound traceability. Replace the example row with exactly one row per accepted criterion.
schema_version: 2
task_slug:
candidate:
  run_id:
  repository_root: ""
  git_common_dir: ""
  source_ref: "refs/heads/integration/"
  source_ref_sha: ""
  base_sha: ""
  commit_sha: ""                 # full 40-character SHA from qa-candidate.json
  generation: 1
  checkout_path: ""
matrix:
  - id: AC-001
    implementation_files: []
    tests: []
    manual_verification: ""
    evidence:
      - path: 09-test-evidence/example.log
        candidate_sha: ""
        sha256: ""                # lowercase SHA-256 after the producer completes
        bytes: 0
        producer: {event_id: "evt-example", event: evidence_produced}
    status: covered              # covered | partial | uncovered
# Every reference also carries sha256, byte size, and one exact target-ledger producer. Partial or
# uncovered rows additionally require the same immutable fields on gate_record plus an exact
# waive_partial/waive_uncovered decision. A prose justification is not authority.

two_voice:
  secondary_provider: ""        # gpt | claude
  status: available             # available | unavailable
  required: true                # cross-check only; the final gate derives this value
two_voice_diff: []
