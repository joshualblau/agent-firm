# agent-firm egress allowlist. One directive per line.
#   host <fqdn>        resolve A records at container start, add each IP to the allowed set
#   cidr <a.b.c.d/nn>  add a literal CIDR (use for published provider/CDN ranges)
#   # ...              comment
# GitHub is added automatically from api.github.com/meta (web+api+git) by egress-firewall.sh.

# --- Package registries ---
host registry.npmjs.org
host pypi.org
host files.pythonhosted.org

# --- Model / provider endpoints ---
host api.anthropic.com          # single stable Anthropic IP — startup-resolve is reliable
host statsig.anthropic.com

# --- OpenAI / Codex (ChatGPT subscription) ---
# WARNING: chatgpt.com / api.openai.com / auth.openai.com sit behind Cloudflare with ROTATING IPs.
# Startup-resolve pins only the anycast IPs returned at boot; they can stop being served minutes later
# -> intermittent connection-refused. Pick ONE mitigation (see docs/PHASE5.md, "Egress firewall"):
#   (a) uncomment these host lines AND run refresh-cdn-allowlist.sh on a ~2-min timer, OR
#   (b) allowlist Cloudflare's published ranges via `cidr` lines (widest exfil surface), OR
#   (c) best: an SNI-filtering egress proxy (CDN-agnostic) — documented, not shipped.
# host chatgpt.com
# host api.openai.com
# host auth.openai.com
